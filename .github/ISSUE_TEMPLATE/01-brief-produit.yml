name: "G1 — Brief produit"
description: "Cadrage d'une idée retenue en G0. Produit par product-scout."
title: "[G1] "
labels: ["gate:G1", "type:idée"]
body:
  - type: input
    id: origine
    attributes:
      label: "Issue G0 d'origine"
      placeholder: "#123 — traçabilité obligatoire (règle 4)"
    validations: {required: true}
  - type: textarea
    id: probleme
    attributes:
      label: "Problème et utilisateur cible"
    validations: {required: true}
  - type: textarea
    id: perimetre
    attributes:
      label: "Périmètre v1 — TROIS fonctionnalités maximum"
      description: "Trois est un MAXIMUM, pas une cible. Si le besoin en exige plus, la conclusion est qu'il faut deux apps (P4)."
      placeholder: "1.\n2.\n3."
    validations: {required: true}
  - type: textarea
    id: hors-perimetre
    attributes:
      label: "Hors périmètre v1"
      description: "Ce qu'on refuse explicitement. C'est cette liste qui défendra le périmètre contre l'inflation."
    validations: {required: true}
  - type: textarea
    id: concurrence
    attributes:
      label: "Analyse concurrentielle — minimum trois apps App Store"
      description: "Prix, modèle économique, note, manques précis."
    validations: {required: true}
  - type: textarea
    id: noms
    attributes:
      label: "Trois noms candidats"
      description: "Avec disponibilité App Store ET nom de domaine. Éviter tout nom dérivé d'un produit existant (rejet Guideline 4.1 Copycats + risque de marque)."
    validations: {required: true}
  - type: textarea
    id: succes
    attributes:
      label: "Critères de succès à 30 et 90 jours"
  - type: textarea
    id: risques
    attributes:
      label: "Risques, dont risque de rejet App Store"
  - type: dropdown
    id: verdict
    attributes:
      label: "Recommandation"
      options: ["GO", "NO-GO"]
    validations: {required: true}
